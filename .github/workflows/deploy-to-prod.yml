name: 운영 배포

on:
  push:
    branches: [ "release-1.0" ]

jobs:
  deploy:
    runs-on: [ self-hosted, "prod" ]
    environment: production
    timeout-minutes: 10

    env:
      DEV_URL: ${{ secrets.DEV_URL }}
      ADMIN_URL: ${{ secrets.ADMIN_URL }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      GOOGLE_ACCOUNT_JSON: ${{ secrets.GOOGLE_ACCOUNT_JSON }}
      GOOGLE_SHEETS_CREDENTIALS_LOCATION: file:/opt/secrets/google-service-account.json
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

    defaults:
      run:
        shell: bash

    steps:
      - name: set SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Checkout application-prod.yml to config path
        uses: actions/checkout@v4
        with:
          repository: '${{ secrets.CONFIG_REPOSITORY }}'
          token: '${{ secrets.TOKEN }}'
          path: config
          sparse-checkout: |
            application-prod.yml
          sparse-checkout-cone-mode: false

      - name: Copy application-prod.yml to Local
        run: |
          mkdir -p ${{ secrets.APP_DIR }}
          cp config/application-prod.yml ${{ secrets.APP_DIR }}/application-prod.yml

      - name: Create Google Service Account json on EC2
        run: |
          sudo mkdir -p /opt/secrets
          echo "${GOOGLE_ACCOUNT_JSON}" | sudo tee /opt/secrets/google-service-account.json > /dev/null
          sudo chmod 600 /opt/secrets/google-service-account.json
          sudo chown ubuntu:ubuntu /opt/secrets/google-service-account.json
          ls -al /opt/secrets/google-service-account.json

      - name: CheckOut with submodule
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          fetch-depth: 0

      - name: Update submodules to latest commit
        run: |
          git submodule update --init --remote --checkout

      - name: Log submodule commit hash
        if: always()
        run: |
          echo "Current commit of allcll-crawler:"
          git -C allcll-crawler rev-parse HEAD

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test with Gradle Wrapper
        run: ./gradlew build

      - name: Validate Observability Secrets
        run: |
          if [ -z "${GRAFANA_ADMIN_PASSWORD}" ]; then
            echo "GRAFANA_ADMIN_PASSWORD secret is required."
            exit 1
          fi

      - name: Copy JAR to Local
        run: |
          mkdir -p ${{ secrets.APP_DIR }}
          cp build/libs/*-SNAPSHOT.jar ${{ secrets.APP_DIR }}/server.jar

      - name: Prepare Application Logs
        run: |
          sudo mkdir -p "${{ secrets.APP_DIR }}/logs"
          if [ ! -f "${{ secrets.APP_DIR }}/logs/spring-boot-application-error.log" ]; then
            sudo touch "${{ secrets.APP_DIR }}/logs/spring-boot-application-error.log"
          fi

      - name: Deploy Observability
        run: |
          mkdir -p ${{ secrets.APP_DIR }}/observability
          cp -R observability/. ${{ secrets.APP_DIR }}/observability/
          printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "${GRAFANA_ADMIN_PASSWORD}" > ${{ secrets.APP_DIR }}/observability/.env
          chmod 600 ${{ secrets.APP_DIR }}/observability/.env

          cd ${{ secrets.APP_DIR }}/observability
          docker compose -p monitoring -f compose.prod.yml up -d

      - name: Wait for Loki and Alloy
        run: |
          for attempt in {1..30}; do
            if docker exec allcll-loki /busybox/wget -q --spider http://127.0.0.1:3100/ready \
              && docker exec allcll-alloy /usr/bin/timeout 2 /usr/bin/bash -c \
                'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/healthy HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3'; then
              echo "Loki and Alloy are ready."
              exit 0
            fi
            sleep 2
          done

          echo "Loki or Alloy did not become ready."
          docker logs allcll-loki || true
          docker logs allcll-alloy || true
          exit 1

      - name: Stop Existing Application
        run: |
          set -x
          PID=$(pgrep -f "server.jar" || true)
          if [ -n "$PID" ]; then
            echo "Stopping existing application..."
            sudo kill -9 $PID
          else
            echo "No existing application found."
          fi

      - name: Run Application
        run: |
          echo "Starting new application..."
          sudo -E nohup java \
          -Dspring.profiles.active=prod \
          -Dspring.config.location=${{ secrets.APP_DIR }}/application-prod.yml \
          -Duser.timezone=Asia/Seoul \
          -Dlogging.file.path=${{ secrets.APP_DIR }}/logs \
          -DEMAIL_PASSWORD="${EMAIL_PASSWORD}" \
          -jar ${{ secrets.APP_DIR }}/server.jar & 
